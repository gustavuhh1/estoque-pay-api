services:
  db:
    image: postgres:latest
    container_name: estoquepay-pg
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user123
      POSTGRES_DB: estoque-db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d estoque-db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Prisma Studio (UI pra ver/editar dados). Não sobe por padrão - só quando
  # pedido explicitamente:  docker compose --profile tools up studio
  studio:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    container_name: estoquepay-studio
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://user:user123@db:5432/estoque-db?schema=public"
    command: ["npx", "prisma", "studio", "--port", "5555", "--browser", "none", "--hostname", "0.0.0.0"]
    ports:
      - "5555:5555"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: estoquepay-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Dentro da rede do compose a API acessa o Postgres pelo nome do serviço
      # ("db"), não por "localhost" - por isso o override aqui em vez de usar
      # o DATABASE_URL do .env (que é para rodar a API direto na máquina).
      DATABASE_URL: "postgresql://user:user123@db:5432/estoque-db?schema=public"
      PORT: "3333"
    ports:
      - "3333:3333"

volumes:
  pgdata:
